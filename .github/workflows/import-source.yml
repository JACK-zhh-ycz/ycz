name: import-source

on:
  push:
    paths:
      - 'source.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -oq source.zip -d .

      - name: Remove archive
        run: rm -f source.zip

      - name: Commit tree
        run: |
          git config user.name "ycz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "导入完整源码树" || echo "nothing to commit"
          git push
